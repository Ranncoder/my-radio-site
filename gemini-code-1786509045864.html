<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deluxe Saloon — Retro Web Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-wood: #1a0f0a;
      --bg-card: #281810;
      --accent-gold: #d4af37;
      --accent-amber: #e67e22;
      --text-cream: #f4ebd9;
      --text-muted: #a69177;
      --border-brass: #8c6d3f;
      --shadow-dark: rgba(0, 0, 0, 0.6);
      --font-display: 'Rye', cursive, serif;
      --font-mono: 'Special Elite', monospace;
      --font-sans: 'Work Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-wood);
      background-image: 
        radial-gradient(circle at center, rgba(40, 24, 16, 0.8) 0%, rgba(15, 8, 4, 0.95) 100%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
      color: var(--text-cream);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 90px; /* Offset for fixed bottom bar */
    }

    /* --- HEADER --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 2px solid var(--border-brass);
      background: linear-gradient(180deg, rgba(40,24,16,0.9) 0%, rgba(20,10,5,0.9) 100%);
      box-shadow: 0 4px 15px var(--shadow-dark);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      fill: var(--accent-gold);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--accent-gold);
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px #000;
    }

    .station-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: var(--border-brass);
      color: var(--bg-wood);
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-weight: bold;
    }

    .time-display {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      color: var(--accent-amber);
      background: rgba(0, 0, 0, 0.4);
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border-brass);
      border-radius: 4px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
    }

    /* --- HERO SECTION --- */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .artwork-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      margin-bottom: 1.5rem;
      border: 8px solid var(--border-brass);
      border-radius: 8px;
      background: #110804;
      box-shadow: 0 10px 30px var(--shadow-dark), inset 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Placeholder Artwork Canvas/Graphic */
    .artwork-placeholder {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #3a2012 0%, #120904 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--border-brass);
      gap: 1rem;
    }

    .artwork-icon {
      width: 80px;
      height: 80px;
      opacity: 0.8;
      fill: var(--accent-gold);
    }

    .hero-info h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--text-cream);
      margin-bottom: 0.4rem;
    }

    .hero-info p {
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* --- FIXED BOTTOM CONTROL BAR --- */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 85px;
      background: linear-gradient(180deg, #2d1b12 0%, #180e09 100%);
      border-top: 3px solid var(--border-brass);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 1.5rem;
      box-shadow: 0 -5px 25px var(--shadow-dark);
      z-index: 100;
    }

    /* Left: Song Info */
    .track-details {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow: hidden;
    }

    .track-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Center: Play Controls */
    .controls-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .btn-circle {
      background: linear-gradient(145deg, #3d2417, #21130b);
      border: 2px solid var(--border-brass);
      color: var(--accent-gold);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .btn-circle:hover {
      border-color: var(--accent-gold);
      transform: translateY(-1px);
      color: var(--text-cream);
    }

    .btn-circle:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      width: 38px;
      height: 38px;
    }

    .btn-play {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, var(--accent-gold), #96741d);
      color: var(--bg-wood);
      border-color: #fff2a8;
    }

    .btn-play:hover {
      background: linear-gradient(145deg, #ffd700, var(--accent-gold));
      color: #000;
    }

    .btn-circle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-play svg {
      width: 24px;
      height: 24px;
      margin-left: 2px; /* Visual center tweak for play triangle */
    }

    /* Right: Rotation Selector */
    .rotation-selector {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.5rem;
    }

    .rotation-selector label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      display: none; /* Hidden on tiny screens, shown on desktop */
    }

    .select-vintage {
      background: #120904;
      color: var(--accent-gold);
      border: 1px solid var(--border-brass);
      padding: 0.4rem 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .select-vintage:focus {
      border-color: var(--accent-gold);
    }

    /* Responsive Adjustments */
    @media (min-width: 640px) {
      .rotation-selector label {
        display: inline-block;
      }
    }

    @media (max-width: 580px) {
      .player-bar {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        height: auto;
        padding: 0.75rem 1rem;
        gap: 0.5rem;
      }

      .track-details {
        grid-column: 1 / 2;
      }

      .rotation-selector {
        grid-column: 2 / 3;
      }

      .controls-main {
        grid-column: 1 / -1;
        justify-content: center;
        padding-top: 0.25rem;
      }

      body {
        padding-bottom: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <h1 class="brand-title">Deluxe Saloon</h1>
      <span class="station-badge">88.5 FM</span>
    </div>
    <div class="time-display" id="clock">12:00:00 PM</div>
  </header>

  <!-- CENTER HERO SECTION -->
  <main class="hero">
    <div class="artwork-container">
      <!-- Illustrative artwork placeholder -->
      <div class="artwork-placeholder">
        <svg class="artwork-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
        </svg>
        <p style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted);">[ ARTWORK CANVAS ]</p>
      </div>
    </div>

    <div class="hero-info">
      <h2 id="current-show">High Noon Honky-Tonk</h2>
      <p id="current-dj">Broadcasting Live with DJ Dusty Spurs</p>
    </div>
  </main>

  <!-- FIXED BOTTOM AUDIO CONTROL BAR -->
  <footer class="player-bar">
    <!-- Left: Track Metadata -->
    <div class="track-details">
      <div class="track-title" id="track-title">Gunslinger's Lullaby</div>
      <div class="track-artist" id="track-artist">The Prairie Outlaws</div>
    </div>

    <!-- Center: Main Controls -->
    <div class="controls-main">
      <button class="btn-circle btn-secondary" aria-label="Previous Track" title="Previous Track">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="btn-circle btn-play" id="play-btn" aria-label="Play or Pause" title="Play/Pause">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn-circle btn-secondary" aria-label="Next Track" title="Next Track">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <!-- Right: Rotation Selector -->
    <div class="rotation-selector">
      <label for="rotation-mode">Rotation:</label>
      <select id="rotation-mode" class="select-vintage">
        <option value="classic">Classic Country</option>
        <option value="honkytonk" selected>Honky-Tonk</option>
        <option value="desert">Desert Blues</option>
        <option value="outlaw">Outlaw Folk</option>
      </select>
    </div>
  </footer>

  <!-- LIGHTWEIGHT INTERACTIVITY SCRIPT -->
  <script>
    // Live Clock Update
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { hour12: true });
      document.getElementById('clock').textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Play/Pause Toggle Simulation
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        // Pause icon path
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        playBtn.style.boxShadow = '0 0 12px var(--accent-gold)';
      } else {
        // Play icon path
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playBtn.style.boxShadow = '0 4px 6px rgba(0,0,0,0.4)';
      }
    });
  </script>
</body>
</html>
